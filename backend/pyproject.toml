[project]
name = "nn-ui-backend"
version = "1.0.0"
description = "nn_UI Backend - FastAPI + PyTorch"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.0",
    "torch>=2.0",
    "torchvision>=0.15",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"